name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: WinGhost is pre-alpha. Please remove secrets and shell history from logs.
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2, build ...
    validations:
      required: true
  - type: input
    id: shell
    attributes:
      label: Shell or profile
      placeholder: PowerShell 7.5, WSL Ubuntu, cmd.exe ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
