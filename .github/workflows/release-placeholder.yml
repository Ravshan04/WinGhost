name: Windows release package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version
        required: true
        default: 0.2.0

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - name: Build release binary
        run: cargo build --release --locked -p winghost
      - name: Stage portable artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/WinGhost | Out-Null
          Copy-Item target/release/winghost.exe dist/WinGhost/
          Copy-Item README.md,LICENSE dist/WinGhost/
          Compress-Archive -Path dist/WinGhost -DestinationPath dist/WinGhost-windows-x64.zip
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ inputs.version }}" "/DSourceExe=$env:GITHUB_WORKSPACE\target\release\winghost.exe" installer\WinGhost.iss
      - name: Upload unsigned Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: WinGhost-${{ inputs.version }}-windows-x64-unsigned
          path: |
            dist/WinGhost-windows-x64.zip
            dist/WinGhost-Setup-x64.exe
          if-no-files-found: error
